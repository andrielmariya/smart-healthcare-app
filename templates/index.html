<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andriel | Health Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #eff6f9; --accent-color: #4834d4; }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 80px; background: white; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .main-wrapper { flex: 1; padding: 30px; overflow-y: auto; }
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; grid-gap: 20px; }
        .health-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        textarea { background: #f8fafb !important; border-radius: 12px !important; }
        .btn-primary { background: #111; border: none; border-radius: 50px; padding: 10px 25px; }
        .result-container { margin-top: 20px; padding: 20px; border-radius: 15px; background: #f0fff4; display: none; border-left: 5px solid #2ecc71; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="text-primary mb-4"><i class="fas fa-columns fa-lg"></i></div>
        <div class="text-muted mb-4"><i class="fas fa-heartbeat fa-lg"></i></div>
    </nav>
    <div class="main-wrapper">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Hi, Andriel!</h2>
                <p class="text-muted mb-0" id="liveDate"></p>
                <p class="fw-bold text-primary mb-0" id="liveClock"></p>
            </div>
            <img src="https://ui-avatars.com/api/?name=Andriel+Mariya&background=4834d4&color=fff" class="rounded-circle" width="45">
        </header>

        <div class="dashboard-grid">
            <div class="health-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">🩺 AI Symptom Analyzer</h5>
                    <span class="badge bg-success-subtle text-success border rounded-pill px-3 py-2">
                        <i class="fas fa-brain me-1"></i> Custom MedQuad Fine-Tuned Llama-3
                    </span>
                </div>
                <textarea id="symptoms" class="form-control mb-3" rows="6" placeholder="Describe how you are feeling..."></textarea>
                <button id="analyzeBtn" class="btn btn-primary">Start AI Analysis -></button>
                <div id="resultBox" class="result-container"></div>
            </div>

            <div class="d-flex flex-column gap-3">
                <div class="health-card" style="background-color: #e3f2fd;">
                    <h6 class="text-primary fw-bold">Hydration</h6>
                    <h3 class="fw-bold">2.15L <small class="fs-6 text-muted">/ Day</small></h3>
                    <div class="badge bg-white text-primary rounded-pill p-2 px-3">Goal: 3.0L</div>
                </div>
                <div class="health-card">
                    <h6 class="text-muted fw-bold">Heart Rate</h6>
                    <canvas id="heartRateChart" style="height: 100px;"></canvas>
                    <h4 class="fw-bold text-center mt-2">72 BPM</h4>
                </div>
                <div class="health-card text-center">
                    <h6 class="text-muted fw-bold mb-3">Daily Steps</h6>
                    <div style="height: 150px; position: relative;">
                        <canvas id="stepsChart"></canvas>
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                            <h4 class="fw-bold mb-0">7,432</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Clock Logic
        function updateClock() {
            const now = new Date();
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('liveClock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. Charts (Simplified)
        new Chart(document.getElementById('heartRateChart'), { type: 'line', data: { labels: [1,2,3,4,5,6], datasets: [{ data: [68,75,71,82,69,72], borderColor: '#4834d4', fill: true, tension: 0.4 }] }, options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } });
        new Chart(document.getElementById('stepsChart'), { type: 'doughnut', data: { datasets: [{ data: [7432, 2568], backgroundColor: ['#2ecc71', '#f0f0f0'] }] }, options: { cutout: '80%' } });

        // 3. AI Analysis
        document.getElementById('analyzeBtn').addEventListener('click', async function() {
            const symptoms = document.getElementById('symptoms').value;
            const resultBox = document.getElementById('resultBox');
            if (!symptoms.trim()) return alert("Please enter symptoms.");

            resultBox.style.display = 'block';
            resultBox.innerHTML = "AI is processing...";

            try {
                const res = await fetch('/analyze-symptoms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symptoms })
                });
                const data = await res.json();
                resultBox.innerHTML = `
                    <h5 class="fw-bold text-success">Possible Condition: ${data.possible_condition}</h5>
                    <p><strong>Advice:</strong> ${data.recommended_actions[0]}</p>
                `;
            } catch (e) { resultBox.innerHTML = "<p class='text-danger'>Server Connection Error.</p>"; }
        });
    </script>
</body>
</html>
